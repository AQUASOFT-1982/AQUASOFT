    /* ===== Design Tokens (matching AQUASoft theme) ===== */
    :root {
      --color-ocean-blue: #1F4B5D;
      --color-aqua: #68CFEB;
      --color-soft-white: #FAFAFA;
      --color-charcoal: #1F1E19;
      --gradient-primary: linear-gradient(135deg, #1F4B5D 0%, #153644 100%);
      --gradient-accent: linear-gradient(135deg, #68CFEB 0%, #4cb8d6 100%);
      --shadow-sm: 0 4px 6px rgba(31, 75, 93, 0.05);
      --shadow-md: 0 10px 20px rgba(31, 75, 93, 0.08);
      --shadow-lg: 0 20px 40px rgba(31, 75, 93, 0.12);
      --shadow-glow: 0 0 20px rgba(104, 207, 235, 0.4);
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--color-soft-white);
      color: var(--color-charcoal);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body.ltr {
      font-family: 'Outfit', sans-serif;
    }

    a { text-decoration: none; color: inherit; transition: var(--transition); }
    ul { list-style: none; }

    /* ===== Navbar ===== */
    .navbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      padding: 1rem 0;
      transition: var(--transition);
      background: transparent;
    }

    .navbar.scrolled {
      background: rgba(250, 250, 250, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-sm);
      padding: 0.7rem 0;
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo img {
      height: 40px;
      width: auto;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .back-btn {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--color-ocean-blue);
      font-weight: 600;
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .back-btn:hover { opacity: 0.75; }

    #lang-toggle {
      padding: 6px 18px;
      font-size: 13px;
      font-weight: 700;
      border: 1.5px solid var(--color-ocean-blue);
      background: transparent;
      color: var(--color-ocean-blue);
      border-radius: 50px;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      letter-spacing: 0.3px;
    }

    #lang-toggle:hover {
      background: var(--color-ocean-blue);
      color: #fff;
    }

    /* ===== Page Hero ===== */
    .page-hero {
      background: var(--gradient-primary);
      padding: 8rem 5% 4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .page-hero::before {
      content: '';
      position: absolute;
      top: -50%; left: -20%;
      width: 60%;
      height: 200%;
      background: radial-gradient(ellipse, rgba(104,207,235,0.15) 0%, transparent 60%);
      pointer-events: none;
    }

    .page-hero::after {
      content: '';
      position: absolute;
      bottom: -30%; right: -10%;
      width: 50%;
      height: 150%;
      background: radial-gradient(ellipse, rgba(104,207,235,0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(104, 207, 235, 0.15);
      border: 1px solid rgba(104, 207, 235, 0.3);
      color: var(--color-aqua);
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 1.2rem;
    }

    .page-hero h1 {
      color: #fff;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .page-hero h1 span {
      background: var(--gradient-accent);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-hero p {
      color: rgba(255,255,255,0.75);
      font-size: 1.1rem;
      max-width: 650px;
      margin: 0 auto;
    }

    /* ===== Main Content Layout ===== */
    .main-content {
      max-width: 1300px;
      margin: 0 auto;
      padding: 2.5rem 5% 5rem;
    }

    /* ===== Search & Filter Controls Card ===== */
    .controls-card {
      background: #fff;
      border-radius: 20px;
      padding: 1.5rem 2rem;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(31, 75, 93, 0.06);
      margin-bottom: 2.5rem;
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      flex: 2;
      min-width: 260px;
      position: relative;
    }

    .search-box i {
      position: absolute;
      top: 50%;
      right: 1.2rem;
      transform: translateY(-50%);
      color: #94a3b8;
      font-size: 1rem;
    }

    html[dir="ltr"] .search-box i {
      right: auto;
      left: 1.2rem;
    }

    .search-box input {
      width: 100%;
      padding: 0.85rem 3rem 0.85rem 1.2rem;
      border-radius: 50px;
      border: 1.5px solid #e2e8f0;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--color-charcoal);
      background: var(--color-soft-white);
      transition: var(--transition);
      outline: none;
    }

    html[dir="ltr"] .search-box input {
      padding: 0.85rem 1.2rem 0.85rem 3rem;
    }

    .search-box input:focus {
      border-color: var(--color-aqua);
      box-shadow: 0 0 0 3px rgba(104, 207, 235, 0.2);
      background: #fff;
    }

    .filter-box {
      flex: 1;
      min-width: 220px;
    }

    .filter-box select {
      width: 100%;
      padding: 0.85rem 1.4rem;
      border-radius: 50px;
      border: 1.5px solid #e2e8f0;
      font-size: 0.92rem;
      font-family: inherit;
      color: var(--color-charcoal);
      background: var(--color-soft-white);
      transition: var(--transition);
      outline: none;
      cursor: pointer;
    }

    .filter-box select:focus {
      border-color: var(--color-aqua);
      box-shadow: 0 0 0 3px rgba(104, 207, 235, 0.2);
    }

    /* ===== Books Grid ===== */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.8rem;
    }

    .book-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(31, 75, 93, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
    }

    .book-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: rgba(104, 207, 235, 0.4);
    }

    .book-header {
      padding: 1.6rem 1.6rem 0.6rem;
    }

    .category-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 4px 12px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(31, 75, 93, 0.08);
      color: var(--color-ocean-blue);
      margin-bottom: 0.8rem;
    }

    .book-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--color-ocean-blue);
      line-height: 1.45;
      margin-bottom: 0.5rem;
    }

    .book-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      color: #64748b;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px dashed #e2e8f0;
    }

    .download-count {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: #059669;
      font-weight: 600;
    }

    .book-footer {
      padding: 1.2rem 1.6rem 1.6rem;
    }

    .btn-read-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.8rem 1.2rem;
      background: var(--gradient-primary);
      color: #fff;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .btn-read-download:hover {
      background: var(--gradient-accent);
      color: var(--color-ocean-blue);
      box-shadow: var(--shadow-glow);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: #64748b;
    }

    .empty-state i {
      font-size: 3rem;
      color: #cbd5e1;
      margin-bottom: 1rem;
    }

    /* ===== Footer ===== */
    .page-footer {
      background: var(--gradient-primary);
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
    }

    .page-footer a { color: var(--color-aqua); }
  </style>
</head>

    // ============================================================
    // STATE & LOGIC
    // ============================================================
    let currentLang = localStorage.getItem('aqasoft_lang') || 'ar';

    function applyLang(lang) {
      currentLang = lang;
      localStorage.setItem('aqasoft_lang', lang);

      const isAr = lang === 'ar';
      document.documentElement.lang = lang;
      document.documentElement.dir = isAr ? 'rtl' : 'ltr';
      document.body.classList.toggle('ltr', !isAr);

      document.getElementById('lang-toggle').textContent = isAr ? 'English' : 'عربي';

      const backIcon = document.getElementById('back-icon');
      if (backIcon) {
        backIcon.className = isAr ? 'fa-solid fa-arrow-right' : 'fa-solid fa-arrow-left';
      }

      // Translate tagged elements
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[lang] && t[lang][key] !== undefined) {
          el.innerHTML = t[lang][key];
        }
      });

      // Translate search placeholder
      const searchInput = document.getElementById('searchInput');
      searchInput.placeholder = isAr ? searchInput.getAttribute('data-placeholder-ar') : searchInput.getAttribute('data-placeholder-en');

      // Retranslate select options
      document.querySelectorAll('#categoryFilter option[data-i18n]').forEach(opt => {
        const key = opt.getAttribute('data-i18n');
        if (key && t[lang][key]) opt.textContent = t[lang][key];
      });

      displayBooks();
    }

    document.getElementById('lang-toggle').addEventListener('click', () => {
      applyLang(currentLang === 'ar' ? 'en' : 'ar');
    });

    // ============================================================
    // DISPLAY BOOKS
    // ============================================================
    function displayBooks() {
      const bookContainer = document.getElementById("bookList");
      const searchTerm = document.getElementById("searchInput").value.trim().toLowerCase();
      const selectedCategory = document.getElementById("categoryFilter").value;
      const lang = currentLang;
      const isAr = lang === 'ar';

      bookContainer.innerHTML = "";

      const filtered = books.filter(book => {
        const titleMatch = (book.titleAr.toLowerCase().includes(searchTerm)) || (book.titleEn.toLowerCase().includes(searchTerm));
        const catMatch = selectedCategory === "all" || book.categoryKey === selectedCategory;
        return titleMatch && catMatch;
      });

      if (filtered.length === 0) {
        bookContainer.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-book-open"></i>
            <h3>${t[lang].empty_title}</h3>
            <p>${t[lang].empty_sub}</p>
          </div>
        `;
        return;
      }

      filtered.forEach(book => {
        const title = isAr ? book.titleAr : book.titleEn;
        const category = isAr ? book.categoryAr : book.categoryEn;

        const card = document.createElement("div");
        card.className = "book-card";

        card.innerHTML = `
          <div class="book-header">
            <div class="category-pill">
              <i class="fa-solid fa-bookmark" style="color: var(--color-aqua);"></i>
              ${category}
            </div>
            <h3 class="book-title">${title}</h3>
            <div class="book-meta-bar">
              <span class="download-count">
                <i class="fa-solid fa-arrow-down-long"></i>
                ${book.views} ${t[lang].lbl_views}
              </span>
              <span style="font-size: 0.75rem; color: #94a3b8;"><i class="fa-solid fa-file-pdf"></i> PDF</span>
            </div>
          </div>
          <div class="book-footer">
            <a href="${book.file}" target="_blank" rel="noopener noreferrer" class="btn-read-download">
              <i class="fa-solid fa-book-open-reader"></i>
              <span>${t[lang].btn_read}</span>
            </a>
          </div>
        `;

        bookContainer.appendChild(card);
      });
    }

    document.getElementById("searchInput").addEventListener("input", displayBooks);
    document.getElementById("categoryFilter").addEventListener("change", displayBooks);

    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 50);
    });

    // Init
    applyLang(currentLang);
  </script>
